{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container py-4">
  <div class="card card-body mx-auto" style="max-width: 600px;">
    <h1 class="h3">Edit option for {{ food.name }}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a href="{% url 'manage_customization_options' food.id %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock content %}
